[project]
name = "security-auto-remediation"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,ec2,iam,rds,dynamodb,sns]>=5", "python-hcl2>=4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
